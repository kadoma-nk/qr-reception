<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QRコード読み取り</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body{font-family:sans-serif;text-align:center;margin:0;padding:20px;background:#f5f5f5}
.box{max-width:500px;margin:auto;background:white;padding:20px;border-radius:12px}
#reader{width:100%;margin:20px auto}
button{font-size:18px;padding:12px 20px;margin:8px;border:0;border-radius:8px;background:#1a73e8;color:white}
#message{font-size:18px;font-weight:bold;margin-top:15px}
</style>
</head>
<body>
<div class="box">
<h2>QRコード読み取り</h2>
<div id="reader"></div>
<button id="startButton" onclick="startScanner()">カメラを起動</button>
<button id="stopButton" onclick="stopScanner()" style="display:none">カメラを停止</button>
<div id="message">カメラを起動してください。</div>
</div>

<script>
let scanner=null;
let scanning=false;

async function startScanner(){
  if(scanning)return;
  document.getElementById("message").textContent="カメラを起動しています…";

  try{
    scanner=new Html5Qrcode("reader");
    await scanner.start(
      {facingMode:"environment"},
      {fps:10,qrbox:{width:250,height:250}},
      onScanSuccess,
      ()=>{}
    );

    scanning=true;
    document.getElementById("startButton").style.display="none";
    document.getElementById("stopButton").style.display="inline-block";
    document.getElementById("message").textContent="QRコードを枠内に合わせてください。";
  }catch(err){
    document.getElementById("message").textContent="カメラを起動できませんでした。";
  }
}

async function onScanSuccess(decodedText){
  if(!scanning)return;
  scanning=false;

  try{await scanner.stop();}catch(e){}

  document.getElementById("reader").style.display="none";
  document.getElementById("startButton").style.display="none";
  document.getElementById("stopButton").style.display="none";

  if(window.opener&&!window.opener.closed){
    window.opener.postMessage({type:"qr-scanned",text:decodedText},"*");
    document.getElementById("message").textContent="受付画面へ送信しました。";
    setTimeout(()=>window.close(),800);
  }else{
    document.getElementById("message").textContent="受付画面が見つかりません。受付スタッフ専用ページから開いてください。";
  }
}

async function stopScanner(){
  if(scanner&&scanning){
    try{await scanner.stop();}catch(e){}
    scanning=false;
  }
  document.getElementById("startButton").style.display="inline-block";
  document.getElementById("stopButton").style.display="none";
  document.getElementById("message").textContent="カメラを停止しました。";
}
</script>
</body>
</html>
