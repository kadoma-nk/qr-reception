<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QRコード受付</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body{font-family:sans-serif;text-align:center;margin:0;padding:15px;background:#f5f5f5}
.box{max-width:500px;margin:auto;background:white;padding:20px;border-radius:12px}
#reader{width:100%;margin:15px auto}
button{font-size:18px;padding:12px 20px;margin:8px;border:0;border-radius:8px;background:#1a73e8;color:white}
#message{font-size:20px;font-weight:bold;margin-top:15px;padding:15px;border-radius:10px}
.ok{background:#d9ead3}.already{background:#fff2cc}.error{background:#f4cccc}
</style>
</head>
<body>
<div class="box">
<h2>QRコード受付</h2>
<div id="reader"></div>
<button id="startButton" onclick="startScanner()">カメラを起動</button>
<div id="message">カメラを起動してください。</div>
</div>

<script>
let scanner=null;
let scanning=false;
let processing=false;
let lastQr="";
let lastTime=0;

async function startScanner(){
  if(scanning)return;

  try{
    scanner=new Html5Qrcode("reader");

    await scanner.start(
      {facingMode:"environment"},
      {fps:10,qrbox:{width:250,height:250}},
      onScanSuccess,
      ()=>{}
    );

    scanning=true;
    document.getElementById("startButton").style.display="none";
    showMessage("QRコードを枠内に合わせてください。","");
  }catch(err){
    showMessage("カメラを起動できませんでした。","error");
  }
}

function onScanSuccess(decodedText){
  if(processing)return;

  const now=Date.now();

  // 同じQRを連続して拾わない
  if(decodedText===lastQr&&now-lastTime<3000)return;

  lastQr=decodedText;
  lastTime=now;
  processing=true;

  showMessage("受付処理中…","");

  if(window.opener&&!window.opener.closed){
    window.opener.postMessage(
      {type:"qr-scanned",text:decodedText},
      "*"
    );
  }else{
    showMessage("受付スタッフ専用ページから開いてください。","error");
    processing=false;
  }
}

window.addEventListener("message",function(event){
  if(!event.data||event.data.type!=="reception-result")return;

  const type=event.data.result||"";
  const message=event.data.message||"";

  showMessage(message,type);

  // 1.5秒後に次のQR受付へ
  setTimeout(()=>{
    processing=false;
    showMessage("次のQRコードを読み取ってください。","");
  },1500);
});

function showMessage(text,type){
  const el=document.getElementById("message");
  el.className=type||"";
  el.textContent=text;
}
</script>
</body>
</html>
