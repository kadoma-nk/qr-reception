<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QRコード読み取り</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .message {
      margin: 15px 0;
      font-size: 16px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 10px;
      padding: 10px;
      box-sizing: border-box;
    }

    button {
      font-size: 18px;
      padding: 12px 25px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
    }

    button:disabled {
      background: #aaa;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 8px;
      word-break: break-all;
      display: none;
    }

    .success {
      color: green;
      font-weight: bold;
      font-size: 20px;
    }

    .error {
      color: #c00;
    }
  </style>
</head>

<body>

  <h1>QRコード読み取り</h1>

  <div class="message" id="message">
    「カメラを起動」を押してください
  </div>

  <button id="startButton" onclick="startScanner()">
    カメラを起動
  </button>

  <button id="stopButton" onclick="stopScanner()" disabled>
    カメラを停止
  </button>

  <div id="reader"></div>

  <div id="result"></div>

  <script>

    let scanner = null;
    let scanning = false;
    let alreadyScanned = false;

    // カメラを起動
    function startScanner() {

      if (scanning) return;

      alreadyScanned = false;

      document.getElementById("message").textContent =
        "QRコードをカメラに映してください";

      document.getElementById("startButton").disabled = true;
      document.getElementById("stopButton").disabled = false;

      scanner = new Html5Qrcode("reader");

      scanner.start(
        { facingMode: "environment" },

        {
          fps: 10,
          qrbox: {
            width: 250,
            height: 250
          }
        },

        function(decodedText) {

          // 同じQRを何度も読み取らない
          if (alreadyScanned) return;

          alreadyScanned = true;

          document.getElementById("message").innerHTML =
            '<span class="success">QRコードを読み取りました</span>';

          document.getElementById("result").style.display = "block";
          document.getElementById("result").textContent =
            decodedText;

          // カメラを停止
          stopScanner();

          // 元の受付ページへQR情報を返す
          if (window.opener && !window.opener.closed) {

            window.opener.postMessage(
              {
                type: "qr-scanned",
                text: decodedText
              },
              "*"
            );

            document.getElementById("message").innerHTML =
              '<span class="success">受付画面へ送信しました</span><br>' +
              'この画面を閉じてください。';

            // 少し待ってから自分を閉じる
            setTimeout(function() {
              window.close();
            }, 1000);

          } else {

            document.getElementById("message").innerHTML =
              '<span class="error">受付画面が見つかりません。</span><br>' +
              '受付スタッフ専用ページから開いてください。';

          }

        },

        function(errorMessage) {
          // QRを見つけられない場合は何もしない
        }

      ).then(function() {

        scanning = true;

      }).catch(function(error) {

        console.error(error);

        document.getElementById("message").innerHTML =
          '<span class="error">' +
          'カメラを起動できませんでした。<br>' +
          'カメラの使用を許可してください。' +
          '</span>';

        document.getElementById("startButton").disabled = false;
        document.getElementById("stopButton").disabled = true;

      });
    }


    // カメラを停止
    function stopScanner() {

      if (!scanner || !scanning) {
        document.getElementById("startButton").disabled = false;
        document.getElementById("stopButton").disabled = true;
        return;
      }

      scanner.stop().then(function() {

        scanner.clear();
        scanning = false;

        document.getElementById("startButton").disabled = false;
        document.getElementById("stopButton").disabled = true;

      }).catch(function(error) {

        console.error(error);
        scanning = false;

        document.getElementById("startButton").disabled = false;
        document.getElementById("stopButton").disabled = true;

      });
    }

  </script>

</body>
</html>
